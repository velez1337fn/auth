<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  /* Делаем чёрный фон, как на твоём скрине */
  body { 
    background-color: #1c1c1e; 
    margin: 0; 
    padding: 0; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    height: 100vh; 
  }
  
  /* Настройка сцены для 3D */
  .scene { 
    width: 100px; 
    height: 100px; 
    perspective: 400px; 
  }
  
  /* Сам куб и его бесконечная крутилка */
  .cube { 
    width: 100%; 
    height: 100%; 
    position: relative; 
    transform-style: preserve-3d; 
    animation: rotateCube 4s infinite linear; 
  }
  
  /* Стенки куба — оранжевые полупрозрачные, чтобы выглядело хакерски */
  .face { 
    position: absolute; 
    width: 100px; 
    height: 100px; 
    border: 2px solid #ff4500; 
    background: rgba(255, 69, 0, 0.15); 
  }
  
  /* Расставляем стенки в 3D пространстве */
  .front  { transform: translateZ(50px); }
  .back   { transform: rotateY(180deg) translateZ(50px); }
  .left   { transform: rotateY(-90deg) translateZ(50px); }
  .right  { transform: rotateY(90deg) translateZ(50px); }
  .top    { transform: rotateX(90deg) translateZ(50px); }
  .bottom { transform: rotateX(-90deg) translateZ(50px); }
  
  /* Анимация вращения по всем осям */
  @keyframes rotateCube { 
    0% { transform: rotateX(0deg) rotateY(0deg); } 
    100% { transform: rotateX(360deg) rotateY(360deg); } 
  }
</style>
</head>
<body>

  <div class="scene">
    <div class="cube">
      <div class="face front"></div>
      <div class="face back"></div>
      <div class="face left"></div>
      <div class="face right"></div>
      <div class="face top"></div>
      <div class="face bottom"></div>
    </div>
  </div>

</body>
</html>
